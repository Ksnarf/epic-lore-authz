[package]
name = "lore-authz-server"
description = "The epic-lore-authz sidecar binary: gRPC (UrcAuthApi, RebacApi) + HTTP (JWKS, login, OIDC/SAML callbacks, health) in one process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lore-authz-server"
path = "src/main.rs"

[dependencies]
lore-authz-core = { workspace = true }
lore-authz-proto = { workspace = true }

tonic = { workspace = true }
tonic-prost = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

tokio = { workspace = true }

jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
