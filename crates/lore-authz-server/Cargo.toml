[package]
name = "lore-authz-server"
description = "The epic-lore-authz sidecar binary: gRPC (UrcAuthApi, RebacApi) + HTTP (JWKS, login, OIDC/SAML callbacks, health) in one process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lore_authz_server"
path = "src/lib.rs"

[[bin]]
name = "lore-authz-server"
path = "src/main.rs"

# DEV ONLY. Test harness for the Phase 0 integration test (see tasks.md):
# mints tokens signed by the same key the server publishes, so a real
# lore-server can be pointed at them. It reads the
# private key straight off disk and applies no policy, so it must never be
# copied into a runtime image next to `lore-authz-server`; it refuses to run
# without LORE_AUTHZ_DEV_MINT=1.
[[bin]]
name = "dev-mint-token"
path = "src/bin/dev_mint_token.rs"

[dependencies]
lore-authz-core = { workspace = true }
lore-authz-proto = { workspace = true }

tonic = { workspace = true }
tonic-prost = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

tokio = { workspace = true }

jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# serde_with: the OIDC ID token's `aud` claim is a single string OR an array
# on the wire, exactly like lore's own tokens -- the same
# `OneOrMany<_, PreferMany>` handling lore-authz-core uses. Promoted from a
# dev-dependency (where it only compiled the vendored compat-test structs)
# to a real one in PHASE 1b for crates/lore-authz-server/src/oidc.rs.
serde_with = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

# PHASE 1b: the OIDC client leg. See the workspace Cargo.toml for why
# native roots rather than webpki roots.
reqwest = { workspace = true }

# Postgres persistence for PHASE 1a (see tasks.md): principals, groups,
# resources, and role_bindings backing LookupUserPermissions /
# CheckUserPermission / RebacApi::CreateResource / DeleteResource. Only
# runtime-checked queries (sqlx::query / query_as) are used, never the
# `query!`/`query_as!` compile-time-checked macros, so `cargo build` never
# needs a reachable Postgres (see crates/lore-authz-server/src/db/mod.rs).
sqlx = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# tests/oidc_flow.rs drives a REAL browser leg against a real IdP container:
# it needs a cookie jar (the IdP sets one between /auth and its callback)
# and control over redirect following, neither of which the non-test client
# in src/oidc.rs uses.
reqwest = { workspace = true, features = ["cookies"] }
