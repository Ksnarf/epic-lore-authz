[package]
name = "lore-authz-server"
description = "The epic-lore-authz sidecar binary: gRPC (UrcAuthApi, RebacApi) + HTTP (JWKS, login, OIDC/SAML callbacks, health) in one process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lore_authz_server"
path = "src/lib.rs"

[[bin]]
name = "lore-authz-server"
path = "src/main.rs"

# DEV ONLY. Test harness for the Phase 0 integration test (see tasks.md):
# mints tokens signed by the same key the server publishes, so a real
# lore-server can be pointed at them. It reads the
# private key straight off disk and applies no policy, so it must never be
# copied into a runtime image next to `lore-authz-server`; it refuses to run
# without LORE_AUTHZ_DEV_MINT=1.
[[bin]]
name = "dev-mint-token"
path = "src/bin/dev_mint_token.rs"

[dependencies]
lore-authz-core = { workspace = true }
lore-authz-proto = { workspace = true }

tonic = { workspace = true }
tonic-prost = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

tokio = { workspace = true }

jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# Only needed to compile the vendored copy of lore-server's AuthorizationToken
# / JWTUserInfo structs (identical `#[serde_as] OneOrMany<_, PreferMany>` `aud`
# handling as upstream) in tests/lore_compat.rs.
serde_with = { workspace = true }
