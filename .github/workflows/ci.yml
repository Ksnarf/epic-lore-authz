name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-test:
    runs-on: ubuntu-latest
    # PHASE 1a (see tasks.md): crates/lore-authz-server/tests/postgres_backed.rs
    # needs a real Postgres, not a mock -- a GitHub Actions service container
    # is the CI equivalent of docker-compose.test.yml's `postgres` service
    # (same image, same throwaway-only guarantee: nothing persists past this
    # job). TEST_DATABASE_URL below points at it on localhost, since service
    # containers on ubuntu-latest runners are reachable directly, unlike the
    # compose network docker-compose.test.yml uses for a local run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-not-a-real-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-not-a-real-secret@localhost:5432/postgres
      # PHASE 1b: crates/lore-authz-server/tests/oidc_flow.rs needs a REAL
      # OpenID Connect provider (see that file and docker/dex/config.yaml for
      # why a mock would not do). These must match docker/dex/config.yaml
      # exactly -- this project refuses a discovery document whose `issuer`
      # disagrees with the one it was fetched from (OIDC Discovery 4.3).
      TEST_OIDC_ISSUER: http://dex:5556/dex
      TEST_OIDC_CLIENT_ID: epic-lore-authz-test
      TEST_OIDC_CLIENT_SECRET: test-only-not-a-real-secret
      TEST_OIDC_REDIRECT_URL: http://127.0.0.1:18080/oidc/callback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Not a GitHub Actions `services:` container, because this one needs a
      # config file mounted from the checkout and `services:` cannot mount
      # one. The /etc/hosts line is what lets ONE committed config file serve
      # both this job and docker-compose.test.yml: Dex bakes its issuer into
      # every discovery document and every ID token, and does NOT expand
      # environment variables in its config (verified against v2.44.0), so
      # the hostname has to be `dex` in both places. Compose resolves it by
      # service name; here it resolves to the published port on loopback.
      - name: Start the OIDC identity provider
        run: |
          echo "127.0.0.1 dex" | sudo tee -a /etc/hosts
          docker run -d --name dex -p 5556:5556 \
            -v "$PWD/docker/dex/config.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.44.0 dex serve /etc/dex/config.yaml
          for _ in $(seq 1 30); do
            if curl -sf "$TEST_OIDC_ISSUER/.well-known/openid-configuration" >/dev/null; then
              echo "identity provider ready"
              exit 0
            fi
            sleep 2
          done
          echo "the identity provider did not become ready" >&2
          docker logs dex >&2
          exit 1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
